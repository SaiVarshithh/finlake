name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: finlake-spark
            context: .
            dockerfile: spark/Dockerfile
          - image: finlake-airflow
            context: airflow
            dockerfile: airflow/Dockerfile
          - image: finlake-dbt
            context: dbt
            dockerfile: dbt/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Build the images using the specified context and Dockerfile.
      # Spark uses the root context to access config/ and spark/ modules.
      # Airflow and dbt remain self-contained in their own folders.
      - name: Build image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Validate dbt project
        if: matrix.image == 'finlake-dbt'
        run: docker run --rm ${{ steps.meta.outputs.image }}:${{ github.sha }} parse

      - name: Validate Airflow DAG imports
        if: matrix.image == 'finlake-airflow'
        run: |
          docker run --rm ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            bash -c "airflow db migrate && airflow dags list"

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.image }}:latest
