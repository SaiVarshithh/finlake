---
apiVersion: v1
kind: Namespace
metadata:
  name: finlake
  labels:
    app: finlake

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finlake-airflow-sa
  namespace: finlake
  labels:
    app: finlake-airflow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finlake-airflow-spark-orchestrator
  namespace: finlake
  labels:
    app: finlake-airflow
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: finlake-airflow-spark-orchestrator
  namespace: finlake
  labels:
    app: finlake-airflow
subjects:
  - kind: ServiceAccount
    name: finlake-airflow-sa
    namespace: finlake
roleRef:
  kind: Role
  name: finlake-airflow-spark-orchestrator
  apiGroup: rbac.authorization.k8s.io

# ── Deployment — long-lasting pod running webserver+scheduler+triggerer ───────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finlake-airflow
  namespace: finlake
  labels:
    app: finlake-airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finlake-airflow
  strategy:
    type: Recreate   # never run two pods at once (shared PG connection pool)
  template:
    metadata:
      labels:
        app: finlake-airflow
    spec:
      serviceAccountName: finlake-airflow-sa
      automountServiceAccountToken: true
      containers:
        - name: airflow
          # Replace <SHA> with the commit SHA tag pushed by docker.yml after
          # each build — same pattern as the Spark image in spark-k8s.yaml.
          image: ghcr.io/saivarshithh/finlake-airflow:latest
          imagePullPolicy: Always
          command: ["airflow", "standalone"]
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            # ── PostgreSQL backend — nessie DB, airflow schema (search_path) ──────
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow_user:airflow_pass@finlake-postgres.finlake.svc.cluster.local:5432/nessie?options=-csearch_path%3Dairflow"
            - name: AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS
              value: "false"
          ports:
            - containerPort: 8080
              name: http
          # No volume mounts on purpose: DAGs are baked into the image at
          # /opt/airflow/dags (see airflow/Dockerfile). Mounting anything at
          # /opt/airflow here would shadow that directory. Metadata is now
          # persisted in PostgreSQL (airflow_db) which survives pod restarts.
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
      # ── Init container: run db migrations before the main pod starts ─────────
      initContainers:
        - name: airflow-db-init
          image: ghcr.io/saivarshithh/finlake-airflow:latest
          imagePullPolicy: Always
          command: ["airflow", "db", "migrate"]
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow_user:airflow_pass@finlake-postgres.finlake.svc.cluster.local:5432/nessie?options=-csearch_path%3Dairflow"
      # Uncomment if finlake-airflow image is private on GHCR:
      # imagePullSecrets:
      #   - name: ghcr-secret

# ── Service — expose the webserver ─────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: finlake-airflow
  namespace: finlake
  labels:
    app: finlake-airflow
spec:
  selector:
    app: finlake-airflow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080   # http://<minikube-ip>:30080
  type: NodePort
