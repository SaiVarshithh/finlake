server:
  workers: 1

additionalConfigProperties:
  - http-server.process-forwarded=true

catalogs:
  iceberg: |
    connector.name=iceberg

    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://finlake-nessie:19120/api/v2
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/

    fs.native-s3.enabled=true
    s3.endpoint=http://finlake-minio:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin

  pgdb: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://finlake-postgres:5432/nessie
    connection-user=nessie
    connection-password=password