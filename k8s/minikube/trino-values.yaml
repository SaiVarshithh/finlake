server:
  workers: 0
  config:
    query:
      maxMemory: "2GB"

coordinator:
  jvm:
    maxHeapSize: "1536M"
  config:
    memory:
      heapHeadroomPerNode: "512MB"
    query:
      maxMemoryPerNode: "1024MB"
    nodeScheduler:
      includeCoordinator: true
  resources:
    requests:
      cpu: "750m"
      memory: "1536Mi"
    limits:
      cpu: "2"
      memory: "2560Mi"

worker:
  jvm:
    maxHeapSize: "1024M"
  config:
    memory:
      heapHeadroomPerNode: "384MB"
    query:
      maxMemoryPerNode: "768MB"
  resources:
    requests:
      cpu: "500m"
      memory: "1280Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

additionalConfigProperties:
  - http-server.process-forwarded=true

catalogs:
  iceberg: |
    connector.name=iceberg

    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://finlake-nessie:19120/api/v2
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/

    fs.native-s3.enabled=true
    s3.endpoint=http://finlake-minio:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin

  pgdb: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://finlake-postgres:5432/nessie
    connection-user=nessie
    connection-password=password
