apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino-ingress-2
  namespace: finlake
spec:
  ingressClassName: nginx

  rules:
  - host: trino.192.168.49.2.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finlake-trino-trino
            port:
              number: 8080


